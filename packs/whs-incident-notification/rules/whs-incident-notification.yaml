- id: written-notice-followup
  version: 1.1.0
  title: "Written notice within 48 hours if the regulator requires it"
  description: "A notice given by telephone may need to be followed by written notice. If the regulator requires it, written notice must be given within 48 hours of that requirement. The model Act text read is the December 2025 version; the same 48 hour period is confirmed in force in the ACT. Other jurisdictions' in-force Acts have not been checked."
  jurisdictions: [ACT, NSW, NT, QLD, SA, TAS, WA]
  when: *notifiable
  then: { required_actions: [{ id: written-notice-if-requested, description: "If you notify by telephone and the regulator asks for written notice, give it within 48 hours of the request, in the form the regulator approves." }] }
  source: { instrument: "Model WHS Act s 38(4)(b), December 2025 version (Safe Work Australia); WorkSafe ACT: Notify WorkSafe ACT", section: "written notice within 48 hours of the regulator's requirement", url: "https://www.safeworkaustralia.gov.au/sites/default/files/2025-12/model-whs-bill-5_december_2025.pdf", retrieved: "2026-11-23" }
  effective_from: "2020-01-01"
  status: active

